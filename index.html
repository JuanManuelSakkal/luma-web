<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma · Lo que elegís</title>
    <meta
      name="description"
      content="Luma: aros, collares, pulseras y anillos para vos. Pedí por WhatsApp, pagá por transferencia y recibilo por moto en CABA o por Correo Argentino en todo el país."
    />
    <meta name="theme-color" content="#542C5D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Vista previa al compartir el link por WhatsApp, Instagram o Facebook.
         Tiene que estar en el HTML porque esas apps no ejecutan JavaScript.
         Cuando Luma tenga dominio, poner la dirección completa en og:image (https://dominio/og-luma.png)
         y sumar <link rel="canonical"> y og:url. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Luma" />
    <meta property="og:title" content="Luma · Lo que elegís" />
    <meta property="og:description" content="Aros, collares, pulseras y anillos elegidos con cariño, pensando en vos." />
    <meta property="og:image" content="/og-luma.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
